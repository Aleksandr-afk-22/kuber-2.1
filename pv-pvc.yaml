---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-data-exchange
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/pv-data-exchange
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-data-exchange
spec:
  volumeName: pv-data-exchange
  storageClassName: ""
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
      - name: busybox-writer
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - while true; do echo $(date) >> /data/output.txt; sleep 5; done
        volumeMounts:
        - name: pv-storage
          mountPath: /data
      - name: multitool-reader
        image: wbitt/network-multitool
        command: ["/bin/sh", "-c"]
        args: ["tail -f /data/output.txt"]
        volumeMounts:
        - name: pv-storage
          mountPath: /data
      volumes:
      - name: pv-storage
        persistentVolumeClaim:
          claimName: pvc-data-exchange